# Tag definitions.
tags:
  release:

# test/release_readiness_test.dart used to be tagged `release` and intended to
# be excluded from ordinary runs. The exclusion was never actually configured,
# so the gate ran on every push and failed on the one check that needs a
# secret - turning main red for the exact reason the exclusion existed.
#
# Excluding the whole file was the wrong fix anyway: checks like "the
# application ID is not com.example" and "a release build cannot silently fall
# back to the debug key" are most useful the moment someone changes them. Only
# the voucher-secret check needs `--dart-define`, and that single test skips
# itself without it.
