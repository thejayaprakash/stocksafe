# `release` marks the launch gate in test/release_readiness_test.dart: checks on
# decisions that are permanent once the app is on Play, or that silently yield a
# build nobody should publish.
#
# It is excluded from the ordinary run so that an unfinished release decision
# does not turn main red on every push. Run it deliberately before an upload:
#
#     flutter test --tags release \
#       --dart-define=STOCKSAFE_VOUCHER_SECRET="$STOCKSAFE_VOUCHER_SECRET"
tags:
  release:
