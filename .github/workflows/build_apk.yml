name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build

      - name: Static code analysis
        run: flutter analyze --no-fatal-infos

      # Rule 2: every schema change ships with a tested migration. Dumping the
      # current schema must produce no diff — if it does, someone changed the
      # tables without regenerating drift_schemas/ and test/generated_migrations/,
      # so migration_test.dart is validating a stale shape.
      - name: Verify migration fixtures are current
        run: |
          dart run drift_dev schema dump lib/src/data/database.dart drift_schemas/
          dart run drift_dev schema steps drift_schemas/ lib/src/data/schema_versions.dart
          if [ -n "$(git status --porcelain drift_schemas/ lib/src/data/schema_versions.dart)" ]; then
            echo "::error::Schema changed but the migration fixtures were not regenerated."
            echo "Run: dart run drift_dev schema dump lib/src/data/database.dart drift_schemas/"
            echo "Then: dart run drift_dev schema steps drift_schemas/ lib/src/data/schema_versions.dart"
            echo "Then: dart run drift_dev schema generate --data-classes --companions drift_schemas/ test/generated_migrations/"
            echo "Then: bash tool/fix_generated_migrations.sh"
            echo "Finally: add the new fromNToN+1 step to AppDatabase.migration and a test for it."
            git status --porcelain drift_schemas/ lib/src/data/schema_versions.dart
            git diff -- drift_schemas/ lib/src/data/schema_versions.dart
            exit 1
          fi

      - name: Run unit & widget tests
        # The `release` tag is the launch gate (test/release_readiness_test.dart).
        # It is excluded here because some of its checks only pass once a release
        # is actually being prepared, and a red main on every push teaches people
        # to ignore red. The launch-gate job below runs it on demand.
        run: flutter test --exclude-tags release

  release:
    name: Generate Artifact
    needs: validate
    environment: Generate Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build

      - name: Check and Configure Release Keystore
        id: signing_config
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'stocksafe' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "::notice::Production release keystore detected. Configuring signed release build..."
            mkdir -p /home/runner/keystores
            echo "$KEYSTORE_BASE64" | base64 -d > /home/runner/keystores/stocksafe-upload.p12
            printf "%s\n" \
              "storeFile=/home/runner/keystores/stocksafe-upload.p12" \
              "storePassword=$KEYSTORE_PASSWORD" \
              "keyAlias=$KEY_ALIAS" \
              "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" \
              > android/key.properties
            echo "is_production=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Release keystore secrets not found. Generating debug-signed tester artifacts."
            echo "is_production=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Android Artifacts
        env:
          IS_PRODUCTION: ${{ steps.signing_config.outputs.is_production }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID || vars.ADMOB_APP_ID }}
          ADMOB_REWARDED_AD_UNIT_ID: ${{ secrets.ADMOB_REWARDED_AD_UNIT_ID || vars.ADMOB_REWARDED_AD_UNIT_ID }}
          STOCKSAFE_VOUCHER_SECRET: ${{ secrets.STOCKSAFE_VOUCHER_SECRET }}
        run: |
          DART_DEFINES=""
          if [ -n "$ADMOB_REWARDED_AD_UNIT_ID" ]; then
            DART_DEFINES="$DART_DEFINES --dart-define=ADMOB_REWARDED_AD_UNIT_ID=${ADMOB_REWARDED_AD_UNIT_ID}"
          fi
          if [ -n "$STOCKSAFE_VOUCHER_SECRET" ]; then
            DART_DEFINES="$DART_DEFINES --dart-define=STOCKSAFE_VOUCHER_SECRET=${STOCKSAFE_VOUCHER_SECRET}"
          fi

          if [ "$IS_PRODUCTION" = "true" ]; then
            echo "Building PRODUCTION-READY signed App Bundle (AAB)..."
            flutter build appbundle --release \
              --android-skip-build-dependency-validation \
              $DART_DEFINES

            echo "Building PRODUCTION-READY signed APK..."
            flutter build apk --release \
              --android-skip-build-dependency-validation \
              $DART_DEFINES

            echo "Verifying App Bundle signing certificate..."
            jarsigner -verify -verbose:summary -certs build/app/outputs/bundle/release/app-release.aab
          else
            echo "Building debug-signed tester APK & App Bundle..."
            flutter build apk --release -PallowDebugSigning=true \
              --android-skip-build-dependency-validation \
              $DART_DEFINES
            flutter build appbundle --release -PallowDebugSigning=true \
              --android-skip-build-dependency-validation \
              $DART_DEFINES
          fi

      - name: Upload Production App Bundle (AAB for Play Store)
        if: steps.signing_config.outputs.is_production == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: StockSafe-PRODUCTION-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload Production APK
        if: steps.signing_config.outputs.is_production == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: StockSafe-PRODUCTION-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload tester APK artifact
        if: steps.signing_config.outputs.is_production != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: StockSafe-TESTING-ONLY-debug-signed-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Upload tester App Bundle artifact (AAB)
        if: steps.signing_config.outputs.is_production != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: StockSafe-TESTING-ONLY-debug-signed-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

  launch-gate:
    name: Launch Gate
    # Run from the Actions tab before a real upload. Not part of the push
    # pipeline: these assert decisions that are permanent once the app is on
    # Play, and the voucher-secret check only passes when given the real secret.
    #
    # Set STOCKSAFE_VOUCHER_SECRET as a repository secret first.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build

      - name: Launch gate (identity, signing, voucher secret)
        run: |
          flutter test test/release_readiness_test.dart \
            --dart-define=STOCKSAFE_VOUCHER_SECRET="$STOCKSAFE_VOUCHER_SECRET" \
            --dart-define=ADMOB_REWARDED_AD_UNIT_ID="${ADMOB_REWARDED_AD_UNIT_ID}"
        env:
          STOCKSAFE_VOUCHER_SECRET: ${{ secrets.STOCKSAFE_VOUCHER_SECRET }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID || vars.ADMOB_APP_ID }}
          ADMOB_REWARDED_AD_UNIT_ID: ${{ secrets.ADMOB_REWARDED_AD_UNIT_ID || vars.ADMOB_REWARDED_AD_UNIT_ID }}
