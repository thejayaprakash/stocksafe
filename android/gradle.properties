org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# AGP 9 compiles Kotlin itself. This must stay ON: six of this app's plugins
# (ML Kit, image_picker, speech_to_text, url_launcher, file_selector) no
# longer apply org.jetbrains.kotlin.android themselves, because AGP 9 rejects
# it when built-in Kotlin is active. With this false their Kotlin sources are
# never compiled and the release build fails with "cannot find symbol" from
# GeneratedPluginRegistrant.
#
# Anything added here must either apply KGP conditionally or not at all.
# share_plus and package_info_plus had to be upgraded for exactly this.
android.builtInKotlin=true
kotlin.incremental=false
allowDebugSigning=true
