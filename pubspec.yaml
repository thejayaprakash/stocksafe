name: stocksafe
description: "Offline stock manager for small shops. Never loses your data."
publish_to: "none"
version: 0.1.0+3

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  path: ^1.9.0
  intl: ^0.20.3
  mobile_scanner: 7.4.2
  csv: ^6.0.0
  share_plus: ^13.3.1
  archive: ^4.0.4
  image_picker: ^1.2.4
  google_mlkit_text_recognition: ^0.17.1
  crypto: ^3.0.6
  speech_to_text: ^7.5.0
  pdf: ^3.13.1
  printing: ^5.15.1
  url_launcher: ^6.3.3
  package_info_plus: ^10.2.2
  file_selector: ^1.1.0
  in_app_purchase: ^3.3.1
  google_mobile_ads: ^9.2.0
  flutter_local_notifications: 18.0.1
  timezone: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true

  assets:
    # Bundled so PDFs and thermal slips can render Tamil. The pdf package's
    # built-in Helvetica/Courier have no Unicode coverage, so Tamil shop and
    # product names printed as blank boxes.
    - assets/fonts/NotoSansTamil.ttf
    - assets/images/
